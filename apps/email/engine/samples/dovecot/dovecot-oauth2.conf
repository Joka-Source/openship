# Dovecot 2.3 OAuth2 passdb settings. The runtime entrypoint replaces the
# dedicated secret placeholder only after the protected engine env-file is read.
client_id = PH_JTYID_DOVECOT_INTROSPECTION_CLIENT_ID
client_secret = PH_JTYID_DOVECOT_INTROSPECTION_SECRET
introspection_mode = post
introspection_url = PH_JTYID_DOVECOT_INTROSPECTION_URL
username_attribute = email
active_attribute = active
active_value = true
tls_ca_cert_file = /etc/ssl/certs/ca-certificates.crt
